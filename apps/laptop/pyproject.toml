[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shruti-array"
version = "0.3.0"
description = "SHRUTI laptop array processor: sync, TDOA, beamforming, ASR, regression harness"
requires-python = ">=3.10"
dependencies = [
  # numpy<2: numpy 2.x's type stubs use the Python 3.12
  # 'type' statement which mypy 2.3.1 (the latest available
  # on PyPI) can't parse. Pinning numpy<2 keeps the stubs
  # parseable on all three Python versions in the CI matrix.
  # The runtime is fine with either major version (the
  # package's code uses only stable numpy APIs). Upgrade
  # mypy past 2.3.1 to drop this pin.
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "websockets>=12.0",
  # The `asr/`, `tts/`, and `render/` modules provide interfaces
  # with optional backends (sherpa-onnx, Piper, matplotlib+pyqtgraph).
  # Pull those in via the `asr`, `tts`, and `ui` extras so the
  # core runtime stays small enough to ship in the Dockerfile.
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "mypy>=1.7",
  "ruff>=0.1",
]
asr = [
  # Real ASR engines the team can plug in on-device.
  # The default ship is a mock; see shruti_array/asr/.
  # sherpa-onnx and its onnxruntime backend are intentionally not
  # pinned here — they pull CUDA / QNN builds and the on-device
  # wiring is event-day work.
]
tts = [
  # Piper TTS runs on the laptop readback. The runtime is C++ and
  # the Python wrapper is small; both ship as part of the event
  # box, not the pip wheel.
]
ui = [
  "matplotlib>=3.7",
  "pyqtgraph>=0.13",
]

[project.scripts]
shruti-array = "shruti_array.cli:main"
shruti-audit = "shruti_array.tools.audit:main"
shruti-corpus = "shruti_array.tools.corpus:main"
shruti-harness = "shruti_array.harness.regression:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shruti_array*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "needs_audio_device: requires an audio device to run",
  "integration: integration tests that spin up sockets/services",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# numpy 2.x's type stubs use the Python 3.12 'type' statement,
# which mypy 2.3.1's parser can't handle on Python 3.10/3.11.
# Tell mypy to skip numpy's stubs entirely (we only type-check
# our own code; numpy's signatures are checked at runtime).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true
