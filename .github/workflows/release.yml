name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-sdist-wheel:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install build
      - name: Build
        working-directory: apps/laptop
        run: |
          python -m pip install --no-deps -e .
          python -m build --sdist --wheel
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shruti-laptop-dist
          path: apps/laptop/dist/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shruti-laptop:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub release
    needs: [build-sdist-wheel, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download sdist + wheel
        uses: actions/download-artifact@v4
        with:
          name: shruti-laptop-dist
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/Team-Chappal/Shruti/blob/main/CHANGELOG.md) for what's changed.
          files: |
            dist/*.tar.gz
            dist/*.whl
          fail_on_unmatched_files: true
