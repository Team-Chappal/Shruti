name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  laptop-tests:
    name: Laptop DSP (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/laptop/pyproject.toml
      - name: Install laptop dependencies
        working-directory: apps/laptop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install pytest-cov
      - name: Lint (ruff)
        working-directory: apps/laptop
        run: |
          python -m pip install ruff
          python -m ruff check shruti_array tests
      - name: Type check (mypy)
        working-directory: apps/laptop
        run: |
          python -m pip install mypy
          # The pyproject.toml [tool.mypy.overrides] section
          # excludes numpy so the Python 3.12-only 'type'
          # statement in numpy 2.x's stubs doesn't break
          # the 3.10/3.11 jobs. We only type-check our own
          # code; numpy's signatures are checked at runtime.
          python -m mypy shruti_array
      - name: Security (bandit)
        working-directory: apps/laptop
        run: |
          python -m pip install bandit
          python -m bandit -r shruti_array -ll -q
      - name: Run laptop test suite
        working-directory: apps/laptop
        run: >-
          python -m pytest -v --tb=short --maxfail=1
          --cov=shruti_array
          --cov-report=term
          --cov-fail-under=75
          --ignore=shruti_array/asr/sherpa_onnx.py
          --ignore=shruti_array/tts/piper.py
      - name: Run the end-to-end demo (smoke)
        working-directory: apps/laptop
        run: python -m shruti_array.cli demo --seconds 1
      - name: Run the benchmark (perf budget)
        # The `tools` package lives at the repo root, not in
        # apps/laptop. GITHUB_WORKSPACE is the runner's
        # checkout root; adding it to PYTHONPATH makes the
        # `tools` package importable from this step.
        working-directory: apps/laptop
        run: PYTHONPATH=$GITHUB_WORKSPACE python -m tools.benchmark
      - name: "Smoke: build the regression report"
        working-directory: apps/laptop
        run: |
          python -m shruti_array.tools.corpus synth --out /tmp/corpus
          python -m shruti_array.harness.regression --scenes 2 --duration-s 1.0 --out /tmp/report.json
          test -f /tmp/report.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laptop-test-report-${{ matrix.python-version }}
          path: apps/laptop/.pytest_cache/

  laptop-windows-smoke:
    name: Laptop demo smoke on Windows
    # This is the venue's host OS. Run the same demo smoke
    # matrix that the Linux job runs, but on windows-latest
    # with a cp1252 console. Catches the UnicodeEncodeError
    # regression in `render/console_radar.py`.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/laptop/pyproject.toml
      - name: Install laptop dependencies
        working-directory: apps/laptop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run the laptop test suite
        working-directory: apps/laptop
        run: >-
          python -m pytest -v --tb=short --maxfail=1
          --no-cov
          --ignore=shruti_array/asr/sherpa_onnx.py
          --ignore=shruti_array/tts/piper.py
      - name: Run the end-to-end demo on a cp1252 console
        # `chcp 65001` switches the Windows console code page to
        # UTF-8 so the radar's bullet glyph renders. The demo
        # also reconfigures stdout to UTF-8 on first render and
        # offers --ascii for legacy hosts. The PYTHONIOENCODING
        # env var is belt-and-braces.
        shell: cmd
        working-directory: apps/laptop
        run: |
          chcp 65001
          set PYTHONIOENCODING=utf-8
          python -m shruti_array.cli demo --seconds 1
      - name: Run the end-to-end demo with --ascii fallback
        # The hard fallback path. Even with no env vars, a
        # default Windows cp1252 console, the radar must render.
        shell: cmd
        working-directory: apps/laptop
        run: python -m shruti_array.cli demo --seconds 1 --ascii

  android-protocol-tests:
    name: Android protocol JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Make gradlew executable
        # The executable bit isn't stored in git; when the
        # runner checks out the repo on Linux, ./gradlew is
        # 0644 and `./gradlew :protocol:test` fails with
        # "Permission denied". This chmod restores the bit
        # for every job on every runner.
        working-directory: apps/android
        run: chmod +x gradlew
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Run :protocol:test
        working-directory: apps/android
        run: ./gradlew :protocol:test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-protocol-test-report
          path: apps/android/protocol/build/reports/tests/test/
